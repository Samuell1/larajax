skills:
  - name: 'larajax/core'
    slug: 'core'
    domain: 'core'
    description: 'Install Larajax, define AJAX handlers in Laravel controllers, and route AJAX requests through onXxx methods.'
    type: 'core'
    covers:
      - 'composer require larajax/larajax'
      - 'npm install larajax'
      - 'LarajaxController base class'
      - 'AjaxController trait'
      - 'onXxx handler naming convention'
      - 'X-AJAX-HANDLER header'
      - 'CSRF/XSRF token handling'
      - 'jax.start() bootstrapping'
    tasks:
      - 'Set up Larajax in a fresh Laravel app'
      - 'Add an AJAX handler to an existing controller'
      - 'Understand how requests are dispatched'
    failure_modes:
      - mistake: 'Handler not named with on prefix and PascalCase'
        mechanism: 'Larajax validates handler names with the regex ^on[A-Z][a-zA-Z]*$. Names like "save" or "onsave" are rejected with HandlerNameInvalid.'
        wrong_pattern: |
          class ProfileController extends LarajaxController
          {
              public function save() { /* ... */ }
          }
        correct_pattern: |
          class ProfileController extends LarajaxController
          {
              public function onSave() { /* ... */ }
          }
        source: 'src/Traits/AjaxController.php:98'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Controller does not extend LarajaxController or use AjaxController trait'
        mechanism: 'AJAX handlers only run when callAction is intercepted. A plain Controller will treat onXxx as ordinary methods and return raw output, breaking the response envelope.'
        wrong_pattern: |
          use Illuminate\Routing\Controller;

          class ProfileController extends Controller
          {
              public function onSave() { /* ... */ }
          }
        correct_pattern: |
          use Larajax\LarajaxController;

          class ProfileController extends LarajaxController
          {
              public function onSave() { /* ... */ }
          }
        source: 'src/LarajaxController.php:19'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'GET request used for an AJAX handler'
        mechanism: 'AjaxRequest::hasAjaxHandler() requires method=POST and the XMLHttpRequest header. A route restricted to GET silently bypasses the handler.'
        wrong_pattern: |
          Route::get('/profile', [ProfileController::class, 'index']);
        correct_pattern: |
          Route::any('/profile', [ProfileController::class, 'index']);
        source: 'src/Classes/AjaxRequest.php:77'
        priority: 'HIGH'
        status: 'active'

  - name: 'larajax/triggers'
    slug: 'triggers'
    domain: 'triggers'
    description: 'Wire HTML elements to AJAX handlers using data-request and the supporting data-request-* attribute family.'
    type: 'core'
    covers:
      - 'data-request="onXxx"'
      - 'data-request-data (JSON or shorthand)'
      - 'data-request-update'
      - 'data-request-validate'
      - 'data-request-confirm'
      - 'data-request-redirect'
      - 'data-request-flash'
      - 'data-request-files'
      - 'data-request-bulk'
      - 'data-request-trigger (input changed delay:300)'
      - 'data-request-poll'
      - 'request lifecycle hooks (data-request-before-send, ...)'
    tasks:
      - 'Submit a form via AJAX'
      - 'Debounce input updates'
      - 'Poll an endpoint on an interval'
      - 'Upload files through an AJAX handler'
    failure_modes:
      - mistake: 'data-request-data passed as plain JSON without quoted keys'
        wrong_pattern: |
          <button data-request="onSave" data-request-data="id: 1">Save</button>
        correct_pattern: |
          <button data-request="onSave" data-request-data="id: 1, name: 'Alice'">Save</button>
        mechanism: 'data-request-data uses a relaxed JSON syntax (keys without quotes are allowed, single quotes around strings). Real JSON works, but the common mistake is using strict JSON with double quotes inside an HTML attribute that is itself wrapped in double quotes.'
        source: 'resources/src/util/json-parser.js'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'File upload missing data-request-files'
        mechanism: 'Without data-request-files, the request body is encoded as application/x-www-form-urlencoded and File inputs are dropped. Adding the attribute switches the body to FormData.'
        wrong_pattern: |
          <form data-request="onUpload">
              <input type="file" name="avatar">
              <button type="submit">Upload</button>
          </form>
        correct_pattern: |
          <form data-request="onUpload" data-request-files>
              <input type="file" name="avatar">
              <button type="submit">Upload</button>
          </form>
        source: 'resources/src/request/options.js:41'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'data-request-update used with non-existing selectors'
        mechanism: 'data-request-update sends a list of partial names via X-AJAX-PARTIALS. The controller still has to call ajax()->partial() (or implement makePartialForAjax) for those names to be returned. Silent: response succeeds with no DOM patch.'
        wrong_pattern: |
          <!-- view -->
          <button data-request="onLoad" data-request-update="profile-card: '#profile'">Load</button>

          // controller
          public function onLoad()
          {
              return ajax()->data(['ok' => true]);
          }
        correct_pattern: |
          public function onLoad()
          {
              return ajax()->partial('profile-card', view('partials.profile-card'));
          }
        source: 'src/Traits/AjaxController.php:113'
        priority: 'HIGH'
        status: 'active'

  - name: 'larajax/responses'
    slug: 'responses'
    domain: 'responses'
    description: 'Build AJAX responses with ajax(): targeted DOM updates, partials, redirects, flash messages, browser events, validation errors, and asset loading.'
    type: 'core'
    covers:
      - 'ajax() helper'
      - 'AjaxResponse::wrap()'
      - 'update([selector => content])'
      - 'partial / partials'
      - 'redirect / reload'
      - 'flash(level, text)'
      - 'browserEvent / browserEventAsync'
      - 'invalidFields / invalidField'
      - 'js / css / img / jsInline'
      - 'error / fatal / exception'
      - 'data / headers / force'
      - 'swap modes: update, replace, append, prepend, after, before'
      - 'selector shorthands: # . @ ^ ! ='
    tasks:
      - 'Update a piece of the page after a save'
      - 'Show a server-side validation error inline'
      - 'Trigger a browser event on the client after the response lands'
      - 'Send a redirect from an AJAX handler'
      - 'Load a script or stylesheet as part of an AJAX response'
    failure_modes:
      - mistake: 'Returning a string and expecting a DOM update'
        mechanism: 'AjaxResponse::wrap() puts non-array scalar return values into data.result, not into ops[]. Nothing in the DOM changes.'
        wrong_pattern: |
          public function onSave()
          {
              return '<div>Saved!</div>';
          }
        correct_pattern: |
          public function onSave()
          {
              return ajax()->update(['#message' => '<div>Saved!</div>']);
          }
        source: 'src/Classes/AjaxResponse.php:127'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Manually returning Validator errors instead of letting ValidationException bubble'
        mechanism: 'AjaxResponse::exception() already converts ValidationException to status 422 with invalidFields(). Catching the exception and returning ajax()->error(...) loses the field-level errors that the client uses to render inline messages.'
        wrong_pattern: |
          public function onSave()
          {
              $v = Validator::make(request()->all(), ['name' => 'required']);
              if ($v->fails()) {
                  return ajax()->error('Validation failed');
              }
          }
        correct_pattern: |
          public function onSave()
          {
              request()->validate(['name' => 'required']);
          }
        source: 'src/Classes/AjaxResponse.php:510'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Using the wrong swap mode for inserting a list item'
        mechanism: 'The default swap is "update" (sets innerHTML). To add a new item without replacing existing ones, use append/prepend or the @ / ^ shorthand.'
        wrong_pattern: |
          return ajax()->update([
              '#todo-list' => view('todo-item', ['todo' => $todo])
          ]);
        correct_pattern: |
          return ajax()->update([
              '#todo-list' => [
                  'content' => view('todo-item', ['todo' => $todo]),
                  'swap' => 'append',
              ],
          ]);
        source: 'src/Classes/AjaxResponse.php:140'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'Returning an associative array assuming it lands in data'
        mechanism: 'When the array has keys that look like CSS selectors (start with # . @ ^ ! =), wrap() routes them through dataWithUpdateSelectors() and converts them into DOM ops. Plain keys still land in data, but mixed arrays surprise callers.'
        wrong_pattern: |
          public function onCheck()
          {
              return [
                  '#status' => 'OK',
                  'count'   => 5,
              ];
          }
        correct_pattern: |
          public function onCheck()
          {
              return ajax()
                  ->data(['count' => 5])
                  ->update(['#status' => 'OK']);
          }
        source: 'src/Classes/AjaxResponse.php:562'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'larajax/components'
    slug: 'components'
    domain: 'components'
    description: 'Define reusable view components that own AJAX handlers, register them on controllers, and dispatch handlers via the alias::onXxx convention.'
    type: 'core'
    covers:
      - 'ViewComponent trait'
      - 'ViewComponentInterface'
      - '$components property on controllers'
      - 'ComponentContainer::$globalComponents'
      - 'alias::onHandler dispatch (X-AJAX-HANDLER: alias::onSave)'
      - 'addComponentInstance / getComponentInstance'
      - 'component boot() hook'
    tasks:
      - 'Extract a reusable widget that handles its own AJAX'
      - 'Register a component globally for every controller'
      - 'Call a component handler from HTML'
    failure_modes:
      - mistake: 'Calling a component handler without the alias prefix'
        mechanism: 'When multiple controllers/components expose onXxx, the alias::onXxx form is what routes the call to the right component. Without the prefix, getAjaxHandlerMethod searches the controller first and may pick up the wrong method or return HandlerNotFound.'
        wrong_pattern: |
          <button data-request="onRefresh">Refresh</button>
        correct_pattern: |
          <button data-request="profileCard::onRefresh">Refresh</button>
        source: 'src/Classes/AjaxRequest.php:91'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'Component class missing the ViewComponent trait'
        mechanism: 'createIn() and bindToController() come from the trait. Without it, ComponentContainer::register() throws a fatal error when iterating the $components array.'
        wrong_pattern: |
          class ProfileCard implements ViewComponentInterface
          {
              public function onRefresh() { /* ... */ }
          }
        correct_pattern: |
          class ProfileCard implements ViewComponentInterface
          {
              use \Larajax\Traits\ViewComponent;

              public function onRefresh() { /* ... */ }
          }
        source: 'src/Traits/ViewComponent.php'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'Forgetting to register the component on the controller'
        mechanism: 'ComponentContainer::register() only iterates $this->controller->components (and the static $globalComponents). A component class that is not in either list is never instantiated and its handlers cannot be found.'
        wrong_pattern: |
          class ProfileController extends LarajaxController
          {
              // No $components declared
          }
        correct_pattern: |
          class ProfileController extends LarajaxController
          {
              public $components = [
                  \App\Components\ProfileCard::class,
              ];
          }
        source: 'src/Classes/ComponentContainer.php:42'
        priority: 'HIGH'
        status: 'active'

tensions:
  - name: 'Targeted DOM updates vs full-page rendering'
    skills: ['responses', 'triggers']
    description: 'data-request-update describes where new HTML should land, but only takes effect if the controller produces matching partials.'
    implication: 'An agent that only edits the controller may forget the view-side wiring (and vice versa). Skills should cross-reference each other.'
  - name: 'Controller-owned handlers vs component-owned handlers'
    skills: ['core', 'components']
    description: 'Two ways to expose onXxx — directly on the controller or via a registered component using the alias::onXxx form.'
    implication: 'An agent picking the wrong style produces handlers that never get called, or duplicates code that should live in a component.'

cross_references:
  - from: 'core'
    to: 'responses'
    reason: 'Handlers defined in core must return AjaxResponse objects from responses.'
  - from: 'triggers'
    to: 'responses'
    reason: 'data-request-update is paired with ajax()->partial() / update() on the response side.'
  - from: 'components'
    to: 'core'
    reason: 'Components register on controllers and rely on the same dispatch pipeline.'

gaps: []
